# Optional reverse proxy in front of the API — not required for local dev
# (docker-compose exposes the API directly on :4000), but matches the
# documented production deployment architecture: Client → Nginx → Express API.

upstream nexuscapital_api {
    server app:4000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://nexuscapital_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
        proxy_pass http://nexuscapital_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://nexuscapital_api;
    }

    # Everything else (the frontend HTML/CSS/JS) — Express serves it from public/
    location / {
        proxy_pass http://nexuscapital_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
